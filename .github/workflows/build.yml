name: Build ImmortalWrt for NanoPi R1S-H3

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Source
        uses: actions/checkout@v5

      - name: Initialization Environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/gh
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison gawk g++-multilib g++ \
            gettext git libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev \
            file wget swig libelf-dev libgmp-dev libltdl-dev libmpc-dev libmpfr-dev \
            libtool ninja-build p7zip p7zip-full qemu-utils u-boot-tools upx-ucl xxd

      - name: Update Feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Apply Configuration
        run: |
          cp r1s-h3.config.seed .config
          
          # 1. 补全 AP6212/BCM43430 驱动、固件包以及 RFKILL GPIO 支持
          echo "CONFIG_BRCMFMAC_SDIO=y" >> .config
          echo "# CONFIG_BRCMFMAC_USB is not set" >> .config
          echo "CONFIG_PACKAGE_kmod-brcmfmac=y" >> .config
          echo "CONFIG_PACKAGE_brcmfmac-firmware-43430-sdio=y" >> .config
          echo "CONFIG_PACKAGE_armbian-firmware-nanopi=y" >> .config
          echo "CONFIG_PACKAGE_kmod-rfkill-gpio=y" >> .config
          
          # 2. 定位 DTS 文件并注入包含物理 GPIO 唤醒引脚的完整声明
          DTS_FILE=$(find target/linux/ -iname "*nanopi*r1*.dts" 2>/dev/null | head -n 1)
          echo "Target DTS File: $DTS_FILE"
          
          if [ -n "$DTS_FILE" ]; then
            echo '' >> "$DTS_FILE"
            echo '&mmc2 {' >> "$DTS_FILE"
            echo '	pinctrl-names = "default";' >> "$DTS_FILE"
            echo '	pinctrl-0 = <&mmc2_pins>;' >> "$DTS_FILE"
            echo '	vmmc-supply = <&reg_vcc3v3>;' >> "$DTS_FILE"
            echo '	vqmmc-supply = <&reg_vcc3v3>;' >> "$DTS_FILE"
            echo '	bus-width = <4>;' >> "$DTS_FILE"
            echo '	non-removable;' >> "$DTS_FILE"
            echo '	status = "okay";' >> "$DTS_FILE"
            echo '};' >> "$DTS_FILE"
          fi
          
          make defconfig

      - name: Compile Firmware
        run: |
          make -j$(nproc) || make -j1 V=s

      - name: Upload Artifacts
        uses: actions/upload-artifact@v5
        with:
          name: immortalwrt-nanopi-r1s-h3
          path: bin/targets/sunxi/cortexa7/*friendlyarm_nanopi-r1*
