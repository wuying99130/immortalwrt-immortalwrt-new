name: Build ImmortalWrt for NanoPi R1S-H3

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Source
        uses: actions/checkout@v5

      - name: Initialization Environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison gawk g++-multilib g++ \
            gettext git libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev \
            file wget swig libelf-dev libgmp-dev libltdl-dev libmpc-dev libmpfr-dev \
            libtool ninja-build p7zip p7zip-full qemu-utils u-boot-tools upx-ucl xxd

      - name: Update Feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Apply Custom Configurations & Hardware Patches
        run: |
          # 1. 复制基础种子配置
          cp r1s-h3.config.seed .config

          # 2. 修改默认 LAN 口 IP 为 192.168.199.1，开启权威 DHCP 模式
          sed -i 's/192.168.1.1/192.168.199.1/g' package/base-files/files/bin/config_generate
          sed -i '/config dnsmasq/a \thoption authoritative 1' package/network/services/dnsmasq/files/dhcp.conf 2>/dev/null || true

          # 3. 激活 DTS 文件中的 mmc2 SDIO WiFi 节点
          DTS_FILE=$(find target/linux/sunxi/ -iname "*nanopi*r1s*.dts" 2>/dev/null | head -n 1)
          if [ -n "$DTS_FILE" ]; then
            sed -i '/&mmc2/,/};/s/status = "disabled";/status = "okay";/' "$DTS_FILE"
          fi

          # 4. 展开并补全依赖关系
          make defconfig

      - name: Download Package Dependencies
        run: |
          make download -j$(nproc)
          find dl -size -1024c -exec rm -f {} \;

      - name: Compile Firmware
        run: |
          make -j$(nproc) || make -j1 V=s

      - name: Organize Artifacts
        run: |
          mkdir -p bin/out
          # 收集编译诊断元数据文件
          cp -f bin/targets/sunxi/cortexa7/*.buildinfo bin/out/ 2>/dev/null || true
          cp -f bin/targets/sunxi/cortexa7/*.manifest bin/out/ 2>/dev/null || true
          cp -f bin/targets/sunxi/cortexa7/profiles.json bin/out/profiles 2>/dev/null || true
          cp -f bin/targets/sunxi/cortexa7/sha256sums bin/out/ 2>/dev/null || true
          
          # 仅提取 NanoPi R1S-H3 的专属固件 (包含 img.gz 与 Docker rootfs.tar.gz)
          cp -f bin/targets/sunxi/cortexa7/*nanopi-r1s-h3*.* bin/out/ 2>/dev/null || true

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ImmortalWrt_NanoPi_R1S-H3
          path: bin/out/*
