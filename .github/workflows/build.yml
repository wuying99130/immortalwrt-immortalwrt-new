name: Build ImmortalWrt for NanoPi R1S-H3

on:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: openwrt-23.05
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: .config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: false
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        sudo docker image prune --all --force
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install -y ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache cmake cpm curl device-tree-compiler fastjar flex gawk gettext gcc-multilib g++-multilib git git-core haveged hinterland-fonts hostapd htop imx-code-sign-tool lib32gcc-s1 lib32stdc++6 libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev libglib2.0-dev libssl-dev libtool llr-dev lrzsz mkisofs msmtp nano ninja-build p7zip p7zip-full patch pkgconf python3 python3-pip python3-ply python3-docutils python3-pyelftools qemu-utils rsync scons squashfs-tools subversion swig texinfo u-boot-tools unittest-cpp upx-ucl unzip vim wget xmlto xz-utils zlib1g-dev zstat
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir

    - name: Clone source code
      working-directory: /workdir
      run: |
        df -hT $PWD
        git clone $REPO_URL -b $REPO_BRANCH openwrt
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

    - name: Load custom feeds
      run: |
        [ -e $FEEDS_CONF ] && mv $FEEDS_CONF openwrt/feeds.conf.default
        chmod +x $DIY_P1_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P1_SH

    - name: Update & Install feeds
      run: |
        cd openwrt
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Load custom configuration
      run: |
        [ -e $CONFIG_FILE ] && mv $CONFIG_FILE openwrt/.config
        chmod +x $DIY_P2_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P2_SH

    - name: Ensure Target Device Profile (NanoPi R1S-H3)
      run: |
        cd openwrt
        # 强制锁定 NanoPi R1S-H3 设备 Profile
        sed -i '/CONFIG_TARGET_MULTI_PROFILE/d' .config
        echo "CONFIG_TARGET_sunxi=y" >> .config
        echo "CONFIG_TARGET_sunxi_cortexa7=y" >> .config
        echo "CONFIG_TARGET_sunxi_cortexa7_DEVICE_friendlyarm_nanopi-r1s-h3=y" >> .config
        echo "CONFIG_TARGET_ROOTFS_EXT4FS=y" >> .config
        make defconfig

    - name: Download package
      id: package
      run: |
        cd openwrt
        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: Compile the firmware
      id: compile
      run: |
        cd openwrt
        echo -e "$(nproc) thread compile"
        make -j$(nproc) || make -j1 || make -j1 V=s
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Organize Artifacts
      run: |
        mkdir -p bin/out
        # 复制包含 nanopi-r1s-h3 的特定固件及相关元信息文件
        cp -f openwrt/bin/targets/sunxi/cortexa7/*nanopi-r1s-h3*.* bin/out/ 2>/dev/null || true
        cp -f openwrt/bin/targets/sunxi/cortexa7/*.buildinfo bin/out/ 2>/dev/null || true
        cp -f openwrt/bin/targets/sunxi/cortexa7/*.manifest bin/out/ 2>/dev/null || true
        cp -f openwrt/bin/targets/sunxi/cortexa7/sha256sums bin/out/ 2>/dev/null || true
        ls -lh bin/out/

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ImmortalWrt_NanoPi_R1S-H3
        path: bin/out/*
