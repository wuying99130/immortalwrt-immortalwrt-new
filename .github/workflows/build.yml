name: Build ImmortalWrt for NanoPi R1S-H3

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Source
        uses: actions/checkout@v5

      - name: Initialization Environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/gh
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison gawk g++-multilib g++ \
            gettext git libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev \
            file wget swig libelf-dev libgmp-dev libltdl-dev libmpc-dev libmpfr-dev \
            libtool ninja-build p7zip p7zip-full qemu-utils u-boot-tools upx-ucl xxd

      - name: Update Feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Apply Configuration
        run: |
          cp r1s-h3.config.seed .config
          
          # 1. 明确指定 Target 设备 Profile 为 FriendlyARM NanoPi R1
          echo "CONFIG_TARGET_sunxi=y" >> .config
          echo "CONFIG_TARGET_sunxi_cortexa7=y" >> .config
          echo "CONFIG_TARGET_DEVICE_sunxi_cortexa7_DEVICE_friendlyarm_nanopi-r1=y" >> .config
          
          # 2. 补充板载第二网口 RTL8152 USB 网卡驱动
          echo "CONFIG_PACKAGE_kmod-usb-net-rtl8152=y" >> .config
          
          # 3. 补充 AP6212/BCM43430 SDIO 无线驱动、固件包及 Wireless 协议栈
          echo "CONFIG_BRCMFMAC_SDIO=y" >> .config
          echo "# CONFIG_BRCMFMAC_USB is not set" >> .config
          echo "CONFIG_PACKAGE_kmod-brcmfmac=y" >> .config
          echo "CONFIG_PACKAGE_brcmfmac-firmware-43430-sdio=y" >> .config
          echo "CONFIG_PACKAGE_armbian-firmware-nanopi=y" >> .config
          echo "CONFIG_PACKAGE_wpad-basic-mbedtls=y" >> .config
          
          # 4. 在 DTS 中激活 mmc2 SDIO WiFi 节点
          DTS_FILE=$(find target/linux/sunxi/ -iname "*nanopi*r1*.dts" 2>/dev/null | head -n 1)
          if [ -n "$DTS_FILE" ]; then
            echo "Applying SDIO overlay to: $DTS_FILE"
            sed -i '/&mmc2/,/};/s/status = "disabled";/status = "okay";/' "$DTS_FILE"
            cat << 'EOF' >> "$DTS_FILE"

&mmc2 {
	pinctrl-names = "default";
	pinctrl-0 = <&mmc2_8bit_pins>;
	vmmc-supply = <&reg_vcc3v3>;
	vqmmc-supply = <&reg_vcc3v3>;
	bus-width = <4>;
	non-removable;
	status = "okay";

	brcmf: wifi@1 {
		reg = <1>;
		compatible = "brcm,bcm4329-fmac";
	};
};
EOF
          fi
          
          make defconfig

      - name: Compile Firmware
        run: |
          make -j$(nproc) || make -j1 V=s

      - name: Upload Artifacts
        uses: actions/upload-artifact@v5
        with:
          name: immortalwrt-nanopi-r1s-h3
          path: bin/targets/sunxi/cortexa7/*friendlyarm_nanopi-r1*
