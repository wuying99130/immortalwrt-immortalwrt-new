name: Build ImmortalWrt for NanoPi R1S-H3

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Source
        uses: actions/checkout@v5

      - name: Initialization Environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/gh
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison gawk g++-multilib g++ \
            gettext git libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev \
            file wget swig libelf-dev libgmp-dev libltdl-dev libmpc-dev libmpfr-dev \
            libtool ninja-build p7zip p7zip-full qemu-utils u-boot-tools upx-ucl xxd

      - name: Update Feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Apply Configuration
        run: |
          cp r1s-h3.config.seed .config
          echo "CONFIG_BRCMFMAC_SDIO=y" >> .config
          echo "# CONFIG_BRCMFMAC_USB is not set" >> .config
          
          # 查找 NanoPi R1 设备树文件并在编译前补全 5.x/6.x 内核下的 SDIO (mmc2) 无线节点
          DTS_FILE=$(find target/linux/sunxi/ -name "*nanopi-r1*.dts*" | head -n 1)
          cat << 'EOF' >> $DTS_FILE

&mmc2 {
	vmmc-supply = <&reg_vcc3v3>;
	vqmmc-supply = <&reg_vcc3v3>;
	bus-width = <4>;
	non-removable;
	status = "okay";

	brcmf: wifi@1 {
		reg = <1>;
		compatible = "brcm,bcm4329-fmac";
	};
};
EOF

          make defconfig

      - name: Compile Firmware
        run: |
          make -j$(nproc) || make -j1 V=s

      - name: Upload Artifacts
        uses: actions/upload-artifact@v5
        with:
          name: immortalwrt-nanopi-r1s-h3
          path: bin/targets/sunxi/cortexa7/*friendlyarm_nanopi-r1*
