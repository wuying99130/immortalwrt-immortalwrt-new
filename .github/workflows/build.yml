name: Build ImmortalWrt 23.05 for NanoPi R1S-H3

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Source (openwrt-23.05)
        uses: actions/checkout@v5
        with:
          ref: openwrt-23.05

      - name: Init Build Environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison gawk g++-multilib g++ \
            gettext git libncurses5-dev libssl-dev python3-distutils \
            rsync unzip zlib1g-dev file wget swig libelf-dev libgmp-dev \
            libltdl-dev libmpc-dev libmpfr-dev libtool ninja-build \
            p7zip-full qemu-utils u-boot-tools upx-ucl xxd

      - name: Update Feeds (23.05)
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Load R1S-H3 Config
        run: |
          cp r1s-h3.config.seed .config

          echo "CONFIG_TARGET_sunxi=y" >> .config
          echo "CONFIG_TARGET_sunxi_cortexa7=y" >> .config
          echo "CONFIG_TARGET_sunxi_cortexa7_DEVICE_friendlyarm_nanopi-r1s-h3=y" >> .config

          make defconfig

      - name: Download Sources
        run: |
          make download -j8
          find dl -size -1024c -delete

      - name: Build Firmware
        run: |
          make -j$(nproc) || make -j1 V=s

      - name: Collect Artifacts
        run: |
          mkdir -p bin/out
          BUILD_DATE=$(date +%Y%m%d)

          for file in bin/targets/sunxi/cortexa7/*nanopi-r1*.img.gz; do
            [ -f "$file" ] || continue
            base=$(basename "$file")
            cp "$file" "bin/out/${base%.img.gz}-${BUILD_DATE}.img.gz"
          done

          for file in bin/targets/sunxi/cortexa7/*rootfs.tar.gz; do
            [ -f "$file" ] || continue
            cp "$file" "bin/out/immortalwrt-sunxi-cortexa7-rootfs-${BUILD_DATE}.tar.gz"
          done

          [ -f bin/targets/sunxi/cortexa7/sha256sums ] && \
            cp bin/targets/sunxi/cortexa7/sha256sums bin/out/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ImmortalWrt-23.05-NanoPi-R1S-H3
          path: bin/out
