name: Build ImmortalWrt for NanoPi R1S-H3

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Source
        uses: actions/checkout@v5

      - name: Initialization Environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison gawk g++-multilib g++ \
            gettext git libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev \
            file wget swig libelf-dev libgmp-dev libltdl-dev libmpc-dev libmpfr-dev \
            libtool ninja-build p7zip p7zip-full qemu-utils u-boot-tools upx-ucl xxd

      - name: Update Feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Apply Custom Configurations & Single Device Lock
        run: |
          # 1. 复制种子配置文件
          cp r1s-h3.config.seed .config

          # 2. 强制注入目标架构与唯一 Profile 锁定
          echo "CONFIG_TARGET_sunxi=y" >> .config
          echo "CONFIG_TARGET_sunxi_cortexa7=y" >> .config
          echo "CONFIG_TARGET_MULTI_PROFILE=y" >> .config
          echo "# CONFIG_TARGET_ALL_PROFILES is not set" >> .config
          echo "CONFIG_TARGET_DEVICE_sunxi_cortexa7_DEVICE_friendlyarm_nanopi-r1s-h3=y" >> .config

          # 3. 展开并补全依赖关系
          make defconfig

      - name: Download Package Dependencies
        run: |
          make download -j$(nproc)
          find dl -size -1024c -exec rm -f {} \;

      - name: Compile Firmware
        run: |
          make -j$(nproc) || make -j1 V=s

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ImmortalWrt_NanoPi_R1S-H3
          path: bin/targets/sunxi/cortexa7/
