name: Build ImmortalWrt for NanoPi R1S-H3

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Source
        uses: actions/checkout@v5

      - name: Init Env
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bison gawk g++-multilib g++ \
            gettext git libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev \
            file wget swig libelf-dev libgmp-dev libltdl-dev libmpc-dev libmpfr-dev \
            libtool ninja-build p7zip-full qemu-utils u-boot-tools upx-ucl xxd

      - name: Update Feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Load Config
        run: |
          cp r1s-h3.config.seed .config

          echo "CONFIG_TARGET_sunxi=y" >> .config
          echo "CONFIG_TARGET_sunxi_cortexa7=y" >> .config
          echo "CONFIG_TARGET_sunxi_cortexa7_DEVICE_friendlyarm_nanopi-r1s-h3=y" >> .config

          make defconfig

      - name: Download
        run: |
          make download -j8
          find dl -size -1024c -delete

      - name: Build
        run: |
          make -j$(nproc) || make -j1 V=s

      - name: Output
        run: |
          mkdir -p bin/out
          cp -f bin/targets/sunxi/cortexa7/* bin/out/ || true

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: R1S-H3
          path: bin/out
